
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | A Taverna</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="stylesheet" href="/src/css/auth.css">
</head>
<body>

    <main class="auth-page">

        <a href="/" class="logo auth-logo">
            <span class="logo-icon">⚔</span>
            <span>A TAVERNA</span>
        </a>

        <section class="auth-card">

            <span class="eyebrow">SUA AVENTURA CONTINUA</span>

            <h1>Bem-vindo de volta</h1>

            <p class="auth-description">
                Entre na sua conta e encontre seus companheiros
                para a próxima aventura.
            </p>

            <form id="login-form">

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="seu@email.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Sua senha"
                        required
                    >
                </div>

                <button type="submit" class="auth-submit">
                    Entrar na taverna
                </button>

                <p id="auth-message" class="auth-message" role="status"></p>

            </form>

            <div class="auth-footer">
                Ainda não possui uma conta?
                <a href="/cadastro.html">Cadastre-se</a>
            </div>

        </section>

        <a href="/" class="back-link">← Voltar para o início</a>

    </main>

    <script type="module" src="/src/auth.js"></script>
</body>
</html>
