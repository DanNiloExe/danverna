
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta | A Taverna</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="stylesheet" href="/src/css/auth.css">
</head>
<body>

    <main class="auth-page">

        <a href="/" class="logo auth-logo">
            <span class="logo-icon">⚔</span>
            <span>A TAVERNA</span>
        </a>

        <section class="auth-card">

            <span class="eyebrow">JUNTE-SE À COMUNIDADE</span>

            <h1>Criar sua conta</h1>

            <p class="auth-description">
                Prepare-se para novas aventuras e conheça
                outros amantes dos jogos de tabuleiro.
            </p>

            <form id="register-form">

                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Seu nome"
                        maxlength="80"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="apelido">Apelido</label>
                    <input
                        type="text"
                        id="apelido"
                        name="apelido"
                        placeholder="Como deseja ser chamado?"
                        maxlength="50"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seu@email.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Mínimo de 8 caracteres"
                        minlength="8"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmar-senha">Confirmar senha</label>
                    <input
                        type="password"
                        id="confirmar-senha"
                        name="confirmar-senha"
                        placeholder="Digite a senha novamente"
                        minlength="8"
                        required
                    >
                </div>

                <button type="submit" class="auth-submit">
                    Criar minha conta
                </button>

                <p id="auth-message" class="auth-message" role="status"></p>

            </form>

            <div class="auth-footer">
                Já possui uma conta?
                <a href="/login.html">Entrar na taverna</a>
            </div>

        </section>

        <a href="/" class="back-link">← Voltar para o início</a>

    </main>

    <script type="module" src="/src/auth.js"></script>
</body>
</html>
